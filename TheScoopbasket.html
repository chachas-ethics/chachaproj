<!DOCTYPE html>
<html lang="en">
<head>
  
  <img style="height: auto;;
  width: 700px;
  display: block;
  margin: auto; " src="thumbnailss/two cones.PNG">
  <meta charset="UTF-8">
  <title>Your Basket</title>
  <style>
    body {
      font-family: poppins;
      background: #fff;
      color: #000;
      padding: 20px;
      font-size: 2rem;
    }

    .basket-container {
      max-width: 800px;
      margin: auto;
      background: #f9f9f9;
      border-radius: 10px;
      padding: 40px;
    }

    .basket-item {
      border-bottom: 1px solid #ddd;
      padding: 20px 0;
    }

    .basket-item button {
      background: rgba(64, 180, 131, 0.9);;
      color: white;
      border: none;
      width: 100%;
      border-radius: 10px;
      padding: 15px 30px;
      font-size: 1.5rem;
      cursor: pointer;
      margin-top: 10px;
    }

    #place-order {
      background: rgba(64, 180, 131, 0.9);;
      color: white;
      width: 100%;
      margin-top: 100px;
      border: none;
      border-radius: 30px;
      padding: 25px 50px;
      font-size: 2rem;
      cursor: pointer;
      font-weight: bold;
      display: block;
      
    }

    

    #empty-msg {
      text-align: center;
      font-size: 3rem;
      margin: 50px 0;
    }
  </style>
</head>
<body>

  <div class="basket-container">
    <h2>Your Basket</h2>
    <div id="basket-items"></div>
    <p id="basket-total">Subtotal: 0 /=</p>
    <button id="place-order">Place Order</button>
  </div>

  <div style="height: 100%;" id="cart">
   <ul id="cart-items"></ul>
  <div id="cart-footer">
  <p id="cart-subtotal"></p>
  </div>

  <script>
    let basket = JSON.parse(localStorage.getItem('basket')) || [];

    const basketItems = document.getElementById('basket-items');
    const basketTotal = document.getElementById('basket-total');
    const placeOrder = document.getElementById('place-order');

    function renderBasket() {
      basketItems.innerHTML = '';
      let total = 0;

      if (basket.length === 0) {
        basketItems.innerHTML = '<p id="empty-msg">Your basket is empty.</p>';
      } else {
        basket.forEach((item, index) => {
          const div = document.createElement('div');
          div.classList.add('basket-item');
          div.innerHTML = `
            <h3>${item.name}</h3>
            <p>${item.price} /=</p>
            <button onclick="removeItem(${index})">Remove</button>
          `;
          basketItems.appendChild(div);
          total += item.price;
        });
      }

      basketTotal.textContent = `Subtotal: ${total} /=`;
    }

    function removeItem(index) {
      basket.splice(index, 1);
      localStorage.setItem('basket', JSON.stringify(basket));
      renderBasket();
    }

    placeOrder.addEventListener('click', () => {
      if (basket.length === 0) {
        alert('Your basket is empty!');
        return;
      }

      const phone = '255676777611';
      let msg = 'Hello, I would like to order:\n';
      let subtotal = 0;

      basket.forEach(item => {
        msg += `- ${item.name} (${item.price} /=)\n`;
        subtotal += item.price;
      });

      msg += `\nSubtotal: ${subtotal} /=`;

      const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
      window.open(url, '_blank');
    });

    renderBasket();
  </script>
</body>
</html>
